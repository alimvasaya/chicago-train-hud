<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
  <title>Chicago Trains</title>
  <link rel="icon" href="icon-96.png" sizes="96x96">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app">

    <!-- Screen 1: start (one press grants location permission) -->
    <section id="screen-start" class="screen">
      <div class="logo">CHICAGO<br>TRAINS</div>
      <p class="hint">Live CTA &amp; Metra near you</p>
      <button id="btn-find" class="focusable cta">Show my trains</button>
    </section>

    <!-- Screen 2: status / errors -->
    <section id="screen-status" class="screen hidden">
      <p id="status-text" class="status">Locating you…</p>
      <button id="btn-retry" class="focusable cta hidden">Try again</button>
    </section>

    <!-- Screen 3: results -->
    <section id="screen-results" class="screen hidden">
      <header class="rhead">
        <div id="station-name" class="station-name">—</div>
        <div class="subrow">
          <span id="line-chips" class="line-chips"></span>
          <span id="station-dist" class="dist"></span>
        </div>
      </header>

      <ul id="trains" class="trains"></ul>

      <footer class="rfoot">
        <span id="pager" class="pager">1 / 1</span>
        <span class="nav-hint">◀ ▶ stations &nbsp;·&nbsp; ⏎ refresh</span>
      </footer>
    </section>

  </main>
  <script src="app.js"></script>
</body>
</html>
